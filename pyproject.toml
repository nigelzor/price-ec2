[project]
name = "price-ec2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40.11",
    "tabulate>=0.9.0",
    "xdg>=6.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.4",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I", "RUF100"]
ignore = ["E501"]
